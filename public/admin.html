<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Admin · Brackets Live</title><link rel="stylesheet" href="/css/styles.css"><link rel="stylesheet" href="/css/admin.css"></head>
<body><main class="paper admin-page">
  <header class="masthead"><div><p class="kicker">CONTROL ROOM</p><h1>ADMINISTRACIÓN</h1><p>Actualiza el torneo sin interrumpir el evento.</p></div><a href="/" class="button dark">VISTA PÚBLICA</a></header>
  <section id="login-panel" class="admin-card"><h2>ENTRAR AL CONTROL</h2><form id="login-form"><input name="username" placeholder="Usuario" autocomplete="username" required><input name="password" placeholder="Contraseña" type="password" autocomplete="current-password" required><button class="button lime">INICIAR SESIÓN</button><p id="login-error" class="error"></p></form></section>
  <section id="control-panel" class="hidden"><div class="admin-toolbar"><div><span class="kicker">TORNEO ACTIVO</span><h2 id="admin-title"></h2></div><button id="wolfcave" type="button" class="button yellow">CARGAR CONFIGURACIÓN COPA WOLFCAVE</button><button id="demo" type="button" class="button yellow">CARGAR DEMO</button><button id="logout" type="button" class="button dark">SALIR</button></div>
    <form id="tournament-form" class="settings-card"><div class="settings-heading"><div><span class="kicker">CONFIGURACIÓN PÚBLICA</span><h2>EDITAR EVENTO</h2></div><button class="button lime">GUARDAR CONFIGURACIÓN</button></div><div class="settings-grid"><label>Nombre del torneo<input id="tournament-name" required maxlength="70"></label><label>Categoría o subtítulo<input id="tournament-category" required maxlength="90"></label><label>Frase principal<input id="tournament-tagline" required maxlength="60"></label><label>Logo (URL opcional)<input id="tournament-logo" type="url" placeholder="https://..."></label><label>Estado<select id="tournament-status"><option value="UPCOMING">PRÓXIMAMENTE</option><option value="LIVE">EN VIVO</option><option value="FINISHED">FINALIZADO</option></select></label><label>Cantidad de equipos<select id="team-count"><option value="4">4 equipos</option><option value="8">8 equipos</option><option value="16">16 equipos</option><option value="32">32 equipos</option></select></label></div><div class="teams-heading"><h3>EQUIPOS Y SIEMBRAS</h3><small>Guardar la configuración reinicia el bracket y conserva los nombres definidos.</small></div><div id="team-fields" class="team-fields"></div><p id="settings-error" class="error"></p></form>
    <div id="matches" class="match-list"></div>
  </section>
</main><script type="module" src="/js/admin.js"></script></body></html>
